[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hybrid-network"
version = "0.1.0"
description = "Rain from commercial microwave links: a power law, a GRU and a gated hybrid of the two, compared on four link archives and on simulations."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Dror Jacoby" }]
keywords = ["commercial microwave links", "rainfall", "hybrid modelling", "GRU"]
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "torch>=2.0",
    "xarray>=2023.1",
    "netCDF4>=1.6",
    "pyarrow>=12",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff>=0.5", "mypy>=1.8"]

[project.scripts]
hybrid-network = "hybrid_network.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

# --------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"

# --------------------------------------------------------------------------
[tool.ruff]
src = ["src", "tests"]
extend-exclude = ["results", "figures", "docs"]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "RUF", "SIM", "PTH", "RET"]
ignore = [
    "E501",    # docstring prose is wrapped by hand
    "B008",    # call in a default argument: used deliberately for configs
    "RUF001", "RUF002", "RUF003",  # prose and labels use real minus and times signs
    "SIM108",  # ternaries are not always clearer
    "RET504",  # a named return value often is the documentation
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B905", "PTH"]

[tool.ruff.lint.isort]
known-first-party = ["hybrid_network"]

# --------------------------------------------------------------------------
[tool.mypy]
# numpy's bundled stubs use `type` statements, which mypy parses at 3.12+.
python_version = "3.12"
files = ["src/hybrid_network"]
namespace_packages = true
explicit_package_bases = true
mypy_path = "src"
# The scientific stack is largely untyped; the package is typed at its own
# boundaries.
ignore_missing_imports = true
warn_unused_configs = true
warn_redundant_casts = true
no_implicit_optional = true
check_untyped_defs = false
